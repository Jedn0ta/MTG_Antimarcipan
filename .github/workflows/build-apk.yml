name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # umožní spustit build ručně z karty Actions

permissions:
  contents: write      # potřeba pro vytvoření Release s APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug -PgitSha=${{ github.sha }} --stacktrace

      - name: Generate version.json
        run: |
          VN=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          cat > version.json <<EOF
          {
            "sha": "${{ github.sha }}",
            "versionName": "${VN}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat version.json

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antimarcipan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Vytvoří / aktualizuje Release "latest-debug" s přiloženým APK + version.json,
      # aby appka poznala novou verzi a dala se stáhnout přímo z telefonu.
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Antimarcipán (debug)
          body: >
            Automaticky sestavené debug APK z posledního commitu.
            Stáhni soubor app-debug.apk níže a nainstaluj v telefonu
            (povol instalaci z neznámých zdrojů), nebo použij v appce
            Nastavení → Zkontrolovat aktualizaci.
          files: |
            app/build/outputs/apk/debug/*.apk
            version.json
          make_latest: true
