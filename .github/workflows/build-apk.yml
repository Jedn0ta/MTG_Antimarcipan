name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # umožní spustit build ručně z karty Actions

permissions:
  contents: write      # potřeba pro vytvoření Release s APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antimarcipan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Vytvoří / aktualizuje Release "latest-debug" s přiloženým APK,
      # aby se dal stáhnout přímo z telefonu bez přihlášení.
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Antimarcipán (debug)
          body: >
            Automaticky sestavené debug APK z posledního commitu.
            Stáhni soubor app-debug.apk níže a nainstaluj v telefonu
            (povol instalaci z neznámých zdrojů).
          files: app/build/outputs/apk/debug/*.apk
          make_latest: true
